name: 构建并推送 Docker 镜像

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: xiaobaiski/sublink
  SINGBOX_VERSION: 1.14.4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查版本号与变更日志
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "版本号: $VERSION"
          head -20 CHANGELOG.md | grep -qF "## [$VERSION]" || { echo "::error::CHANGELOG.md 顶部缺少 ## [$VERSION] 的变更记录"; exit 1; }
          grep -qF "当前版本 **$VERSION**" README.md || { echo "::error::README.md 中的当前版本不是 $VERSION"; exit 1; }

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载 sing-box
        run: |
          curl -fsSL -o sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          echo "SINGBOX_BIN=$PWD/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" >> $GITHUB_ENV

      - name: 订阅转换测试
        run: python tests/test_sub.py

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}

      - name: 读取版本号
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_OUTPUT

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 构建测试镜像(amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sublink:test
          build-args: PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        run: |
          docker run -d --name sublink-test -p 8000:5000 sublink:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ > /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="app">'
          docker exec sublink-test test -f /app/app/db/singbox.json
          docker exec sublink-test test -s /app/app/db/jwt_secret
          for target in clash surge singbox loon quanx general v2ray; do
            curl -fsS http://127.0.0.1:8000/sub/$target/dGVzdA== | grep -q '订阅不存在\|\\u8ba2\\u9605'
          done
          curl -fsS http://127.0.0.1:8000/sub/unknown/dGVzdA== | grep -q '"code":400'

      - name: 冒烟测试失败时输出容器日志
        if: failure()
        run: docker logs sublink-test || true

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max
